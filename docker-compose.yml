# docker-compose.yml
version: "3.9"

services:
  dev:
    build: .
    image: course-env:24.04
    container_name: final-project-container
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - ${HOME:-$USERPROFILE}/.ssh:/root/.ssh:ro              #mount ssh dir read only
      - ${HOME:-$USERPROFILE}/.gitconfig:/root/.gitconfig:ro  #mount gitconfig dir read only
    working_dir: /workspace   
    cpus: 4         # Limit to 4 CPUs (adjust if desired)
    mem_limit: 4g   # Limit memory (adjust if desired)
    security_opt:
      - no-new-privileges:true
      - seccomp=./default.json
